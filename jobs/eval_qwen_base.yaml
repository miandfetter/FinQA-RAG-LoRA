# Evaluate base Qwen on the 300 test questions, retrieved and oracle modes, in one job.
# Submit with:  gcloud ai custom-jobs create --region=<REGION> --display-name=eval-qwen-base --config=jobs/eval_qwen_base.yaml
workerPoolSpecs:
  - machineSpec:
      machineType: g2-standard-8
      acceleratorType: NVIDIA_L4
      acceleratorCount: 1
    replicaCount: 1
    diskSpec:
      bootDiskType: pd-ssd
      bootDiskSizeGb: 100
    containerSpec:
      imageUri: us-central1-docker.pkg.dev/finqa-rag-lora/finqa/finqa-gpu:v2
      args: ["eval", "--config", "/gcs/finqa-rag-lora-data/configs/qa_qwen_base.yaml",
             "--modes", "retrieved", "oracle",
             "--gcs-root", "/gcs/finqa-rag-lora-data"]