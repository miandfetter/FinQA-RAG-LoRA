# Teacher run: Gemini answers the TRAIN questions; its correct answers become LoRA training data.
# Same prompt and scoring as the baseline. Only the rate settings differ (it's ~6,250 calls).
run_name: teacher_gemini_3.5_flash_lite   # change together with `model` when comparing teachers
generator: gemini
model: gemini-3.5-flash-lite
temperature: 0
max_output_tokens: 4096
thinking_budget: null
k: 3

requests_per_minute: 120        # raise if you see few rate-limit waits; lower if you see many
concurrency: 8
max_retries: 8

corpus_path: data/corpus.parquet
eval_dir: data
retrieval_dir: results
results_dir: results/qa