[project]
name = "finqa-rag-lora"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mfetter", email = "miandfeter@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "faiss-cpu>=1.15.1",
    "google-genai>=2.30.1",
    "mlflow>=3.17.1",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
finqa-rag-lora = "finqa_rag_lora:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
]
